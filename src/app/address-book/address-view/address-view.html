<form class="ui large form segment address-view-form">
  <h3 class="ui header section-title">Address Details</h3>
  <fieldset [disabled]="!edit ? true : null" class="address-fieldset">
    <div class="form-group mb-3">
      <label for="firstName">First Name</label>
      <input class="form-control" name="firstName" id="firstName" [(ngModel)]="address.firstName">
    </div>
    <div class="form-group mb-3">
      <label for="lastName">Last Name</label>
      <input class="form-control" name="lastName" id="lastName" [(ngModel)]="address.lastName">
    </div>
    <div class="form-group mb-3">
      <label for="phone">Phone Number</label>
      <input class="form-control" name="phone" id="phone" [(ngModel)]="address.phone">
    </div>
    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input class="form-control" name="email" id="email" [(ngModel)]="address.email">
    </div>
    <div class="form-group mb-3">
      <label for="notes">Notes</label>
      <textarea class="form-control" rows="4" cols="60" name="notes" id="notes" [(ngModel)]="address.notes"></textarea>
    </div>
  </fieldset>
  <div class="btn-toolbar address-view-btns" role="toolbar">
    <button type="button" class="btn btn-danger" name="delete" (click)="delete()">Delete</button>
    @if (edit) {
      <button type="button" (click)="toggleEdit()" class="btn btn-secondary ms-2">Protect</button>
    } @else {
      <button type="button" (click)="toggleEdit()" class="btn btn-secondary ms-2">Edit</button>
    }
  </div>
</form>
